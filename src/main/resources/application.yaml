server:
  port: 8080

spring:
  application:
    name: data-encryption-demo
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5432}/data-encryption-demo
    username: ${DBMS_USERNAME:postgres}
    password: ${DBMS_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
